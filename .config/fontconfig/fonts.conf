<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<fontconfig>

  <!-- Fuente por defecto sans-serif -->
  <alias>
    <family>sans-serif</family>
    <prefer>
      <family>Lilex Nerd Font</family>
    </prefer>
  </alias>

  <!-- Fuente por defecto serif -->
  <alias>
    <family>serif</family>
    <prefer>
      <family>Lilex Nerd Font</family>
    </prefer>
  </alias>

  <!-- Fuente por defecto monospace -->
  <alias>
    <family>monospace</family>
    <prefer>
      <family>Lilex Nerd Font</family>
    </prefer>
  </alias>

</fontconfig>
